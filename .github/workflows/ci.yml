name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pokemon_ci
          POSTGRES_USER: pokemon_ci
          POSTGRES_PASSWORD: pokemon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=pokemon_ci --dbname=pokemon_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://pokemon_ci:pokemon_ci@127.0.0.1:5432/pokemon_ci
      TEST_DATABASE_URL: postgresql+psycopg://pokemon_ci:pokemon_ci@127.0.0.1:5432/pokemon_ci
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --requirement requirements.txt

      - name: Prepare PostgreSQL schema
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["TEST_DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
          engine.dispose()
          PY
          alembic upgrade head

      - name: Run test suite
        run: python -m unittest discover -s tests -v
