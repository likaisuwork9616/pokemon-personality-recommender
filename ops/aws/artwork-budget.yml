AWSTemplateFormatVersion: "2010-09-09"
Description: Monthly CloudFront and S3 artwork cost budget with email alerts

Parameters:
  AlertEmail:
    Type: String
    Description: Operator email that receives AWS Budget notifications
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Monthly CloudFront and S3 budget in USD

Resources:
  ArtworkDeliveryBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: pokemon-artwork-delivery
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters:
          Service:
            - Amazon CloudFront
            - Amazon Simple Storage Service
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  BudgetName:
    Value: !Ref ArtworkDeliveryBudget
