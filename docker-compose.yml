services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokemon}
      POSTGRES_USER: ${POSTGRES_USER:-pokemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pokemon}:${POSTGRES_PASSWORD:-pokemon}@db:5432/${POSTGRES_DB:-pokemon}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-default}
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - model_cache:/models
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      embed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - alembic
      - upgrade
      - head
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pokemon}:${POSTGRES_PASSWORD:-pokemon}@db:5432/${POSTGRES_DB:-pokemon}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - scripts/import_pokemon.py
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pokemon}:${POSTGRES_PASSWORD:-pokemon}@db:5432/${POSTGRES_DB:-pokemon}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  embed:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - scripts/rebuild_embeddings.py
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pokemon}:${POSTGRES_PASSWORD:-pokemon}@db:5432/${POSTGRES_DB:-pokemon}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-default}
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - model_cache:/models
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  model_cache:
