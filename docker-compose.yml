x-database-url: &database-url "postgresql+psycopg://${POSTGRES_USER:-pokemon}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the stack}@db:5432/${POSTGRES_DB:-pokemon}"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokemon}
      POSTGRES_USER: ${POSTGRES_USER:-pokemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the stack}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DATABASE_URL: *database-url
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-default}
      PGVECTOR_SEARCH_MODE: ${PGVECTOR_SEARCH_MODE:-hnsw}
      HNSW_EF_SEARCH: ${HNSW_EF_SEARCH:-100}
      HNSW_ITERATIVE_SCAN: ${HNSW_ITERATIVE_SCAN:-strict_order}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-20}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - model_cache:/models
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      embed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - python
      - scripts/reindex_worker.py
    environment:
      DATABASE_URL: *database-url
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-default}
      REINDEX_WORKER_POLL_SECONDS: ${REINDEX_WORKER_POLL_SECONDS:-2}
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - model_cache:/models
    depends_on:
      embed:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - alembic
      - upgrade
      - head
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - scripts/import_pokemon.py
    environment:
      DATABASE_URL: *database-url
      POKEMON_ARTWORK_BASE_URL: ${POKEMON_ARTWORK_BASE_URL:-https://d3s7iszk0n7xst.cloudfront.net/images/pokemon/artwork}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  embed:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - scripts/rebuild_embeddings.py
    environment:
      DATABASE_URL: *database-url
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-default}
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - model_cache:/models
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  model_cache:
